pid file=/rsync/rsyncd.pid
log file=/rsync/rsyncd.log
lock file=/rsync/rsyncd.lock

[data]
        comment = data
        uid = root
        gid = root
        path = /rsync/data
        use chroot = yes
        max connections = 320
        read only = no
        strict modes = yes
        ignore errors = no
        ignore nonreadable = yes
        transfer logging = no
        timeout = 600
        refuse options = checksum dry-run
        dont compress = *.gz *.tgz *.zip *.z *.rpm *.deb *.iso *.bz2 *.tbz
        auth users = dslztx
        secrets file = /rsync/rsyncd.secrets
        hosts allow = 10.0.0.0/8
